name: CustomPlayerAdvancements
version: 1.0.0
main: afx.customplayeradvancements.CustomPlayerAdvancements
api-version: '26.2'
author: AFXPlugins
description: >
  Fully customizable advancement messages.

depend:
  - packetevents

softdepend:
  - PlaceholderAPI

commands:
  advancements:
    description: CustomPlayerAdvancements commands
    usage: /advancements <reload|update>
    aliases:
      - customplayeradvancements
    permission: customplayeradvancements.admin
    permission-message: You do not have permission to use this command.

permissions:
  customplayeradvancements.admin:
    description: Allows use of all CustomPlayerAdvancement commands.
    default: op
