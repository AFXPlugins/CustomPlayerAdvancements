# ====================================
# Reload command: /advancements reload
# ====================================


# ========================================================================
#                            Player Name Format
# ========================================================================
# How to use PlaceholderAPI placeholders:
# https://wiki.placeholderapi.com/users/using-placeholders/
#
# Format for the player name in advancement messages.
# Supports any PlaceholderAPI placeholder and '&' colors.
# Example: %luckperms_prefix%%essentials_nickname%
player-name-format: "%player_name%"
# ========================================================================


# ========================================================================
#                       Advancement Message Formats
# ========================================================================
# advancement-color = Color of advancement name and hover box text.
messages:
  task:
    phrase: "&fhas made the advancement"
    advancement-color: "&a"

  goal:
    phrase: "&fhas reached the goal"
    advancement-color: "&a"

  challenge:
    phrase: "&fhas completed the challenge"
    advancement-color: "&5"
# ========================================================================

# =================================
# PLEASE DO NOT CHANGE THIS VALUE!
plugin-version: 1
# =================================
